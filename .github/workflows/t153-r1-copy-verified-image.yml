name: Copy verified T153 r1 image
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: t153-r1-image-copy
  cancel-in-progress: false
jobs:
  copy-verified-raw:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET_TAG: v25.12.2-t153-immortalwrt-r1
      SOURCE_TAG: v25.12.2-t153-immortalwrt-preview.2
      ASSET: immortalwrt-sunxi-cortexa7-dshanpi_t153mx-omnigate-ext4-raw.img
      EXPECTED_SHA256: 2a0baa4305fda37071734b81a86ef468915f56b0cd828d3ab44bb18c961da853
    steps:
      - name: Verify source image and upload to existing draft
        shell: bash
        run: |
          set -euo pipefail
          test "$GH_REPO" = dshanpi/OmniGateT153-Openwrt25
          release_id="$(gh api "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TARGET_TAG\") | .id")"
          test -n "$release_id"
          test "$(gh api "repos/$GH_REPO/releases/$release_id" --jq '.draft')" = true
          existing_digest="$(gh api "repos/$GH_REPO/releases/$release_id/assets?per_page=100" \
            --jq ".[] | select(.name == \"$ASSET\") | .digest")"
          if test -n "$existing_digest"; then
            test "$existing_digest" = "sha256:$EXPECTED_SHA256"
            printf 'Existing image verified: %s\n' "$existing_digest" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          image_path="$RUNNER_TEMP/$ASSET"
          curl --fail --location --retry 3 --output "$image_path" \
            "https://github.com/$GH_REPO/releases/download/$SOURCE_TAG/$ASSET"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$image_path" | sha256sum -c -
          gh release upload "$TARGET_TAG" "$image_path" --repo "$GH_REPO"
          uploaded_digest="$(gh api "repos/$GH_REPO/releases/$release_id/assets?per_page=100" \
            --jq ".[] | select(.name == \"$ASSET\") | .digest")"
          test "$uploaded_digest" = "sha256:$EXPECTED_SHA256"
          printf 'Verified and uploaded %s\nSHA256: %s\n' "$ASSET" "$EXPECTED_SHA256" >> "$GITHUB_STEP_SUMMARY"
